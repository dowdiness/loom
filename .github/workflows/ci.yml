name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      markdown_delimiter_aa_calibration:
        description: Run the Markdown delimiter performance guard as an exact same-SHA A/A calibration
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Covers loom modules and checked-out submodules, including the lambda/egraph
# path that depends on event-graph-walker.

jobs:
  dep-check:
    name: Dependency Boundary Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Run check-deps.sh
        run: bash check-deps.sh

  bench-detector-selftest:
    name: Benchmark Detector Self-Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Detector policy self-test
        run: bash scripts/bench-check-selftest.sh
      - name: MarkdownIR performance guard self-test
        run: bash scripts/markdown-ir-perf-guard-selftest.sh
      - name: Validate checked-in detector policy
        run: bash bench-check.sh --validate

  markdown-ir-perf-guard:
    name: MarkdownIR Performance Guard (${{ matrix.target }})
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.markdown_delimiter_aa_calibration)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, js]
    env:
      BENCH_TARGET: ${{ matrix.target }}
      DELIMITER_PERF_HARNESS_PATH: examples/markdown/delimiter_performance_wbtest.mbt
      DELIMITER_PERF_ADAPTER_PATH: examples/markdown/delimiter_performance_api_wbtest.mbt
      DELIMITER_PERF_LEGACY_ADAPTER_PATH: scripts/tests/markdown-delimiter-performance-legacy-api-wbtest.mbt
    steps:
      - name: Checkout base
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          path: perf-base
          persist-credentials: false
          submodules: recursive
      - name: Checkout head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: perf-head
          persist-credentials: false
          submodules: recursive
      - name: Snapshot shared delimiter benchmark harness
        shell: bash
        run: |
          set -euo pipefail

          base_sha=$(git -C perf-base rev-parse HEAD)
          head_sha=$(git -C perf-head rev-parse HEAD)
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" &&
                ("$base_sha" != "$GITHUB_SHA" || "$head_sha" != "$GITHUB_SHA") ]]; then
            echo "A/A calibration must compare github.sha with itself" >&2
            echo "github.sha=$GITHUB_SHA base=$base_sha head=$head_sha" >&2
            exit 1
          fi

          source_path="perf-head/$DELIMITER_PERF_HARNESS_PATH"
          snapshot_dir="$RUNNER_TEMP/markdown-delimiter-perf-harness"
          snapshot_path="$snapshot_dir/delimiter_performance_wbtest.mbt"
          current_adapter_source="perf-head/$DELIMITER_PERF_ADAPTER_PATH"
          current_adapter_snapshot="$snapshot_dir/delimiter_performance_api_wbtest.mbt"
          legacy_adapter_source="perf-head/$DELIMITER_PERF_LEGACY_ADAPTER_PATH"
          legacy_adapter_snapshot="$snapshot_dir/delimiter_performance_legacy_api_wbtest.mbt"

          git -C perf-head ls-files --error-unmatch -- \
            "$DELIMITER_PERF_HARNESS_PATH" \
            "$DELIMITER_PERF_ADAPTER_PATH" \
            "$DELIMITER_PERF_LEGACY_ADAPTER_PATH" >/dev/null
          for tracked_input in \
            "$source_path" \
            "$current_adapter_source" \
            "$legacy_adapter_source"; do
            if [[ ! -f "$tracked_input" || -L "$tracked_input" ]]; then
              echo "delimiter benchmark input must be a tracked regular file: $tracked_input" >&2
              exit 1
            fi
          done

          install -d -m 0755 "$snapshot_dir"
          install -m 0644 "$source_path" "$snapshot_path"
          install -m 0644 "$current_adapter_source" "$current_adapter_snapshot"
          install -m 0644 "$legacy_adapter_source" "$legacy_adapter_snapshot"
          harness_sha256=$(sha256sum "$snapshot_path" | awk '{print $1}')
          current_adapter_sha256=$(sha256sum "$current_adapter_snapshot" | awk '{print $1}')
          legacy_adapter_sha256=$(sha256sum "$legacy_adapter_snapshot" | awk '{print $1}')
          if git -C perf-base cat-file -e "HEAD:$DELIMITER_PERF_ADAPTER_PATH"; then
            base_adapter_kind=current
          else
            base_adapter_kind=legacy
          fi

          echo "Markdown delimiter benchmark harness SHA-256: $harness_sha256"
          echo "Markdown delimiter current API adapter SHA-256: $current_adapter_sha256"
          echo "Markdown delimiter legacy API adapter SHA-256: $legacy_adapter_sha256"
          echo "Markdown delimiter base API adapter: $base_adapter_kind"
          echo "Benchmark refs: base=$base_sha head=$head_sha"
          {
            echo "DELIMITER_PERF_HARNESS_SNAPSHOT=$snapshot_path"
            echo "DELIMITER_PERF_HARNESS_SHA256=$harness_sha256"
            echo "DELIMITER_PERF_CURRENT_ADAPTER_SNAPSHOT=$current_adapter_snapshot"
            echo "DELIMITER_PERF_CURRENT_ADAPTER_SHA256=$current_adapter_sha256"
            echo "DELIMITER_PERF_LEGACY_ADAPTER_SNAPSHOT=$legacy_adapter_snapshot"
            echo "DELIMITER_PERF_LEGACY_ADAPTER_SHA256=$legacy_adapter_sha256"
            echo "DELIMITER_PERF_BASE_ADAPTER_KIND=$base_adapter_kind"
          } >> "$GITHUB_ENV"
      - name: Install MoonBit
        env:
          MOONBIT_INSTALL_VERSION: 0.10.4+2cc641edf
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Verify MoonBit
        run: moon version --all
      - name: Resolve base and head dependencies
        run: |
          (cd perf-base && moon update)
          (cd perf-head && moon update)
      # Compare base/head on one runner for each backend matrix leg. Alternate
      # execution order to cancel thermal and host-load drift. The delimiter
      # benchmark harness is snapshotted from head and overlaid identically on
      # each checkout so a PR can introduce fail-closed rows without making its
      # base output structurally incomparable. A private adapter isolates
      # parser-construction API cutovers; both sides use the current adapter
      # once the base tracks it, while a fixed legacy adapter supports older
      # bases. The checker blocks persistent regressions; the weekly detector
      # remains the more sensitive absolute-baseline alert.
      - name: Compare Markdown performance
        run: |
          set -euo pipefail

          output_dir="$RUNNER_TEMP/markdown-ir-perf-guard/$BENCH_TARGET"
          mkdir -p "$output_dir"

          remove_overlay() {
            local checkout="$1"
            rm -f "$checkout/$DELIMITER_PERF_HARNESS_PATH"
            rm -f "$checkout/$DELIMITER_PERF_ADAPTER_PATH"
          }

          remove_all_overlays() {
            remove_overlay perf-base
            remove_overlay perf-head
          }

          verify_file_hash() {
            local path="$1"
            local expected="$2"
            local description="$3"
            local actual
            if [[ ! -f "$path" || -L "$path" ]]; then
              echo "$description must be a regular file: $path" >&2
              return 1
            fi
            actual=$(sha256sum "$path" | awk '{print $1}')
            if [[ "$actual" != "$expected" ]]; then
              echo "$description hash changed: expected $expected, got $actual" >&2
              return 1
            fi
          }

          verify_overlay() {
            local checkout="$1"
            local adapter_sha256="$DELIMITER_PERF_CURRENT_ADAPTER_SHA256"
            if [[ "$checkout" == "perf-base" &&
                  "$DELIMITER_PERF_BASE_ADAPTER_KIND" == "legacy" ]]; then
              adapter_sha256="$DELIMITER_PERF_LEGACY_ADAPTER_SHA256"
            fi
            verify_file_hash \
              "$checkout/$DELIMITER_PERF_HARNESS_PATH" \
              "$DELIMITER_PERF_HARNESS_SHA256" \
              "delimiter benchmark harness overlay in $checkout" || return 1
            verify_file_hash \
              "$checkout/$DELIMITER_PERF_ADAPTER_PATH" \
              "$adapter_sha256" \
              "delimiter benchmark API adapter overlay in $checkout" || return 1
          }

          install_overlay() {
            local checkout="$1"
            local adapter_snapshot="$DELIMITER_PERF_CURRENT_ADAPTER_SNAPSHOT"
            local adapter_sha256="$DELIMITER_PERF_CURRENT_ADAPTER_SHA256"
            if [[ "$checkout" == "perf-base" &&
                  "$DELIMITER_PERF_BASE_ADAPTER_KIND" == "legacy" ]]; then
              adapter_snapshot="$DELIMITER_PERF_LEGACY_ADAPTER_SNAPSHOT"
              adapter_sha256="$DELIMITER_PERF_LEGACY_ADAPTER_SHA256"
            fi
            remove_overlay "$checkout"
            verify_file_hash \
              "$DELIMITER_PERF_HARNESS_SNAPSHOT" \
              "$DELIMITER_PERF_HARNESS_SHA256" \
              "delimiter benchmark harness snapshot" || return 1
            verify_file_hash \
              "$adapter_snapshot" \
              "$adapter_sha256" \
              "delimiter benchmark API adapter snapshot" || return 1
            install -m 0644 "$DELIMITER_PERF_HARNESS_SNAPSHOT" \
              "$checkout/$DELIMITER_PERF_HARNESS_PATH"
            install -m 0644 "$adapter_snapshot" \
              "$checkout/$DELIMITER_PERF_ADAPTER_PATH"
            verify_overlay "$checkout"
          }

          trap remove_all_overlays EXIT

          run_trial() {
            label="$1"
            checkout="$2"
            output="$3"
            remove_all_overlays
            install_overlay "$checkout"
            echo "Running $label"
            command_status=0
            (
              cd "$checkout"
              if ! moon bench --release --target "$BENCH_TARGET" \
                -p dowdiness/markdown -f benchmark_test.mbt; then
                printf 'standard Markdown benchmark failed for %s\n' "$label" >&2
                exit 1
              fi
              # The shared white-box harness requires these private resolver
              # symbols on both revisions: DelimiterResolverEvent,
              # EmphasisDelimiterMarker, AsteriskDelimiter,
              # UnderscoreDelimiter, PushLinkLabelScope,
              # ResolveLinkLabelScope, OpaqueInlineEvent, and
              # DelimiterSourceRange.
              if ! moon bench --release --target "$BENCH_TARGET" \
                -p dowdiness/markdown -f delimiter_performance_wbtest.mbt; then
                printf '%s\n' \
                  "shared delimiter benchmark failed for $label" \
                  'keep the harness and its versioned API adapter compatible with both base and head' >&2
                exit 1
              fi
            ) > "$output" 2>&1 || command_status=$?

            hash_status=0
            verify_file_hash \
              "$DELIMITER_PERF_HARNESS_SNAPSHOT" \
              "$DELIMITER_PERF_HARNESS_SHA256" \
              "delimiter benchmark harness snapshot" || hash_status=$?
            verify_overlay "$checkout" || hash_status=$?
            remove_overlay "$checkout"

            if [[ "$hash_status" -ne 0 ]]; then
              cat "$output"
              return "$hash_status"
            fi
            if [[ "$command_status" -ne 0 ]]; then
              cat "$output"
              return "$command_status"
            fi
          }

          for trial in 1 2 3; do
            if (( trial % 2 == 1 )); then
              run_trial "$BENCH_TARGET base trial $trial" perf-base "$output_dir/base-$trial.txt"
              run_trial "$BENCH_TARGET head trial $trial" perf-head "$output_dir/head-$trial.txt"
            else
              run_trial "$BENCH_TARGET head trial $trial" perf-head "$output_dir/head-$trial.txt"
              run_trial "$BENCH_TARGET base trial $trial" perf-base "$output_dir/base-$trial.txt"
            fi
          done

          echo "Checking $BENCH_TARGET Markdown performance"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            export MARKDOWN_DELIMITER_PERF_CALIBRATION=1
          fi
          bash perf-head/scripts/markdown-ir-perf-guard.sh \
            "$output_dir/base-1.txt" "$output_dir/head-1.txt" \
            "$output_dir/base-2.txt" "$output_dir/head-2.txt" \
            "$output_dir/base-3.txt" "$output_dir/head-3.txt"

  docs-check:
    name: Docs Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so the changed-archived-plan decision-record check
          # can diff against origin/main instead of warn-skipping.
          fetch-depth: 0
          # Submodules so links pointing INTO incr/egraph/egglog docs
          # resolve — the link check validates them against the pinned
          # submodule revision, same as a local --recursive clone.
          submodules: recursive
      - name: Run check-docs.sh
        env:
          # For the Active-plans GitHub-state check (section 8).
          GH_TOKEN: ${{ github.token }}
        run: bash check-docs.sh

  agent-readiness-selftest:
    name: Agent Readiness Self-Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run agent-readiness unit tests
        run: python -m unittest discover -s scripts/tests -p 'test_agent_readiness.py'

  mbti-check:
    name: Interface Drift Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # moon info resolves cross-member workspace deps, so submodule
          # members must be present.
          submodules: recursive
      - name: Install MoonBit
        env:
          MOONBIT_INSTALL_VERSION: 0.10.4+2cc641edf
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: Verify MoonBit
        run: moon version --all
      - name: moon update
        run: moon update
      # Regenerate every workspace member's .mbti and fail on drift:
      # committed interfaces must match what the pinned toolchain derives
      # from the code. Submodules regenerate too but their inner files are
      # invisible to the parent pathspec diff — each submodule owns its own
      # interface hygiene.
      - name: moon info
        run: moon info
      - name: Interfaces are committed and current
        run: |
          git diff --exit-code -- '*.mbti'
          untracked=$(git ls-files --others --exclude-standard -- '*.mbti')
          if [[ -n "$untracked" ]]; then
            echo "Untracked generated interfaces:"
            echo "$untracked"
            exit 1
          fi

  quickstart-check:
    name: README Quick Start
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install MoonBit
        env:
          MOONBIT_INSTALL_VERSION: 0.10.4+2cc641edf
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: Verify MoonBit
        run: moon version --all
      # Runs the commands extracted from the root README's Quick Start fence,
      # so a broken or drifted Quick Start fails CI instead of the next
      # fresh clone. See scripts/check-quickstart.sh for the two documented
      # transformations (clone → ls-remote, skip the post-clone cd).
      - name: Quick Start commands (tests)
        run: bash scripts/check-quickstart.sh --tests
      - name: Quick Start commands (bench)
        run: bash scripts/check-quickstart.sh --bench

  fmt-check:
    name: Format Check ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - name: diagnostic
            path: diagnostic
          - name: diagnostic-moji
            path: diagnostic-moji
          - name: diagnostic-pretty
            path: diagnostic-pretty
          - name: diagnostic-consumer-fixture
            path: fixtures/diagnostic_consumer
          - name: diagnostic-pretty-consumer-fixture
            path: fixtures/diagnostic_pretty_consumer
          - name: loom
            path: loom
          - name: text-change
            path: text-change
          - name: moji
            path: moji
          - name: seam
            path: seam
          - name: pretty
            path: pretty
          - name: loomgen
            path: loomgen
          - name: examples-lambda
            path: examples/lambda
          - name: examples-json
            path: examples/json
          - name: examples-json-settings
            path: examples/json-settings
          - name: examples-markdown
            path: examples/markdown
          - name: examples-jsx
            path: examples/jsx
          - name: incr
            path: incr
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install MoonBit
        env:
          MOONBIT_INSTALL_VERSION: 0.10.4+2cc641edf
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Verify MoonBit
        run: moon version --all

      - name: moon update
        working-directory: ${{ matrix.path }}
        run: moon update

      - name: moon fmt --check
        working-directory: ${{ matrix.path }}
        run: moon fmt --check

      - name: Verify Markdown Unicode data regenerated
        if: matrix.name == 'examples-markdown'
        working-directory: examples/markdown
        run: |
          python3 tools/gen_unicode_punctuation_symbol.py
          moon fmt unicode_punctuation_symbol.mbt
          git ls-files --error-unmatch unicode_punctuation_symbol.mbt
          git diff --exit-code -- unicode_punctuation_symbol.mbt

  fmt-check-submodules:
    name: Format Check ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: egglog
            path: egglog
    env:
      NEW_MOON_MOD: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install MoonBit
        env:
          MOONBIT_INSTALL_VERSION: 0.10.4+2cc641edf
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Verify MoonBit
        run: moon version --all

      - name: moon update
        working-directory: ${{ matrix.path }}
        run: moon update

      - name: moon fmt --check
        working-directory: ${{ matrix.path }}
        run: moon fmt --check

  test-modules:
    name: Check + Test ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NEW_MOON_MOD: '0'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - name: diagnostic
            path: diagnostic
            module: dowdiness/diagnostic
          - name: diagnostic-moji
            path: diagnostic-moji
            module: dowdiness/diagnostic_moji
          - name: diagnostic-pretty
            path: diagnostic-pretty
            module: dowdiness/diagnostic_pretty
          - name: diagnostic-consumer-fixture
            path: fixtures/diagnostic_consumer
            module: dowdiness/diagnostic-consumer-fixture
          - name: diagnostic-pretty-consumer-fixture
            path: fixtures/diagnostic_pretty_consumer
            module: dowdiness/diagnostic-pretty-consumer-fixture
          - name: loom
            path: loom
            module: dowdiness/loom
          - name: text-change
            path: text-change
            module: dowdiness/text_change
          - name: moji
            path: moji
            module: dowdiness/moji
          - name: seam
            path: seam
            module: dowdiness/seam
          - name: pretty
            path: pretty
            module: dowdiness/pretty
          - name: examples-lambda
            path: examples/lambda
            module: dowdiness/lambda
          - name: examples-json
            path: examples/json
            module: dowdiness/json
          - name: examples-json-settings
            path: examples/json-settings
            module: dowdiness/json-settings
          - name: examples-markdown
            path: examples/markdown
            module: dowdiness/markdown
          - name: examples-html
            path: examples/html
            module: dowdiness/html
            target: native
          - name: examples-css
            path: examples/css
            module: dowdiness/css-example
            target: native
          - name: examples-graph-dsl
            path: examples/graph-dsl
            module: dowdiness/graph-dsl
            target: native
          - name: examples-moonbit
            path: examples/moonbit
            module: dowdiness/moonbit-example
            target: native
          - name: examples-jsx
            path: examples/jsx
            module: dowdiness/jsx
            target: native
          - name: incr
            path: incr
            module: ''
          - name: loomgen
            path: loomgen
            module: dowdiness/loomgen
            target: native
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install MoonBit
        env:
          MOONBIT_INSTALL_VERSION: 0.10.4+2cc641edf
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Verify MoonBit
        run: moon version --all

      - name: moon update
        working-directory: ${{ matrix.path }}
        run: moon update

      - name: moon check
        working-directory: ${{ matrix.path }}
        run: moon check

      - name: moon test
        working-directory: ${{ matrix.path }}
        run: |
          args=()
          if [[ -n "${{ matrix.module }}" ]]; then
            args+=(-p "${{ matrix.module }}")
          fi
          if [[ -n "${{ matrix.target }}" ]]; then
            args+=(--target "${{ matrix.target }}")
          fi
          moon test "${args[@]}"

      - name: Native Markdown CST safety regression
        if: matrix.name == 'examples-markdown'
        working-directory: examples/markdown
        run: moon test native_regression_test.mbt --target native

      - name: Native CommonMark audit taxonomy
        if: matrix.name == 'examples-markdown'
        working-directory: examples/markdown
        run: moon test src/tools/commonmark_html_audit --target native --deny-warn

  test-modules-submodules:
    name: Check + Test ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: egglog
            path: egglog
    env:
      NEW_MOON_MOD: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install MoonBit
        env:
          MOONBIT_INSTALL_VERSION: 0.10.4+2cc641edf
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Verify MoonBit
        run: moon version --all

      - name: moon update
        working-directory: ${{ matrix.path }}
        run: moon update

      - name: moon check
        working-directory: ${{ matrix.path }}
        run: moon check

      - name: moon test
        working-directory: ${{ matrix.path }}
        run: moon test


  check-loomgen:
    name: Check Loomgen
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install MoonBit
        env:
          MOONBIT_INSTALL_VERSION: 0.10.4+2cc641edf
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Verify MoonBit
        run: moon version --all

      - name: moon update
        working-directory: .
        run: moon update

      - name: Build loomgen
        working-directory: .
        run: moon build loomgen --target native

      - name: Check generated files are up to date
        working-directory: .
        run: |
          moon run loomgen --target native -- \
            --seed examples/lambda/syntax/syntax_kind.mbt \
            examples/lambda/token/token.mbt \
            --term examples/lambda/meta/term_kind.mbt \
            examples/lambda/token examples/lambda/syntax
          git diff --exit-code -- examples/lambda/syntax/syntax_kind.mbt
      - name: Verify HTML syntax kinds preserve seeded raw IDs
        working-directory: .
        run: |
          moon run loomgen --target native -- \
            --seed examples/html/syntax/syntax_kind.mbt \
            examples/html/token/token.mbt \
            --term examples/html/meta/term_kind.mbt \
            examples/html/token examples/html/syntax
          moon fmt \
            examples/html/syntax/syntax_kind.mbt \
            examples/html/syntax/element_props.g.mbt \
            examples/html/token/token_impls.g.mbt \
            examples/html/token/sync_point.g.mbt
          git diff --exit-code -- \
            examples/html/syntax/syntax_kind.mbt \
            examples/html/syntax/element_props.g.mbt \
            examples/html/token/token_impls.g.mbt \
            examples/html/token/sync_point.g.mbt

      - name: Verify token impls regenerated
        working-directory: .
        run: |
          moon run loomgen --target native -- \
            --seed examples/lambda/syntax/syntax_kind.mbt --skip-syntax \
            examples/lambda/token/token.mbt examples/lambda/token
          git diff --exit-code -- examples/lambda/token/token_impls.g.mbt
      - name: Verify spec generation matches compiled consumer
        working-directory: .
        run: |
          mkdir -p /tmp/spec-token /tmp/spec-syntax
          moon run loomgen --target native -- \
            --seed examples/lambda/syntax/syntax_kind.mbt --skip-syntax \
            --spec examples/lambda/spec.g.mbt \
            --language lambda \
            --syntax-type SyntaxKind \
            examples/lambda/token/token.mbt \
            --term examples/lambda/meta/term_kind.mbt \
            /tmp/spec-token /tmp/spec-syntax
          git diff --exit-code -- examples/lambda/spec.g.mbt
      - name: Verify lambda grammar-ir generation from .loomgrammar
        working-directory: .
        run: |
          mkdir -p /tmp/lambda-ir-token /tmp/lambda-ir-syntax
          moon run loomgen --target native -- \
            --seed examples/lambda/syntax/syntax_kind.mbt --skip-syntax \
            --grammar-ir examples/lambda/grammar_ir.g.mbt \
            --language lambda \
            --grammar-file examples/lambda/lambda.loomgrammar \
            --token-qual @token --syntax-qual @syntax --core-qual @core \
            examples/lambda/token/token.mbt \
            --term examples/lambda/meta/term_kind.mbt \
            /tmp/lambda-ir-token /tmp/lambda-ir-syntax
          moon fmt examples/lambda/grammar_ir.g.mbt
          git diff --exit-code -- examples/lambda/grammar_ir.g.mbt


      - name: Verify json syntax_kind regenerated
        working-directory: .
        run: |
          moon run loomgen --target native -- \
            --seed examples/json/syntax_kind.mbt \
            examples/json/token.mbt \
            --term examples/json/meta/term_kind.mbt \
            /tmp/json-token /tmp/json-syntax
          git diff --exit-code -- examples/json/syntax_kind.mbt

      - name: Verify json spec generation matches compiled consumer
        working-directory: .
        run: |
          mkdir -p /tmp/json-spec-token /tmp/json-spec-syntax
          moon run loomgen --target native -- \
            --seed examples/json/syntax_kind.mbt --skip-syntax \
            --spec examples/json/spec.g.mbt \
            --language json \
            --syntax-type SyntaxKind \
            --token-qual "" --syntax-qual "" \
            examples/json/token.mbt \
            --term examples/json/meta/term_kind.mbt \
            /tmp/json-spec-token /tmp/json-spec-syntax
          git diff --exit-code -- examples/json/spec.g.mbt

      - name: Verify view fixture generation
        working-directory: .
        run: |
          mkdir -p /tmp/vf-token /tmp/vf-syntax
          moon run loomgen --target native -- \
            loomgen/fixtures/view_fixture.mbt \
            /tmp/vf-token /tmp/vf-syntax
          git diff --exit-code -- /tmp/vf-syntax/views.g.mbt loomgen/fixtures/views_fixture.g.mbt

      - name: Verify multi-trivia spec generation
        working-directory: .
        run: |
          mkdir -p /tmp/mt-token /tmp/mt-syntax
          moon run loomgen --target native -- \
            --spec loomgen/fixtures/multi_trivia_spec.g.mbt \
            --language MultiTrivia \
            --syntax-type MultiTriviaSyntaxKind \
            loomgen/fixtures/multi_trivia_fixture.mbt \
            /tmp/mt-token /tmp/mt-syntax
          git diff --exit-code -- loomgen/fixtures/multi_trivia_spec.g.mbt

      - name: Verify lexmode generation
        working-directory: .
        run: |
          mkdir -p /tmp/lm-token /tmp/lm-syntax
          moon run loomgen --target native -- \
            loomgen/fixtures/lexmode_fixture.mbt \
            /tmp/lm-token /tmp/lm-syntax
          diff /tmp/lm-syntax/lexmode.g.mbt loomgen/fixtures/lexmode_fixture.g.mbt

      - name: Verify lexer skeleton generation
        working-directory: .
        run: |
          mkdir -p /tmp/ls-token /tmp/ls-syntax
          moon run loomgen --target native -- \
            loomgen/fixtures/lexmode_fixture.mbt \
            /tmp/ls-token /tmp/ls-syntax
          diff /tmp/ls-syntax/lexer_skeleton.g.mbt loomgen/fixtures/lexer_skeleton_fixture.g.mbt
      - name: Verify grammar_ir compile-regression fixture
        working-directory: .
        run: |
          bash fixtures/grammar_ir_regression/regenerate.sh
          git diff --exit-code -- fixtures/grammar_ir_regression/grammar_ir.g.mbt
          moon check --target native fixtures/grammar_ir_regression
          moon test --target native fixtures/grammar_ir_regression
      - name: Verify line lexer compile-regression fixture
        working-directory: .
        run: |
          bash fixtures/line_lexer_regression/regenerate.sh
          bash fixtures/line_lexer_regression/helper_write_failure.sh
          git diff --exit-code -- \
            loomgen/fixtures/error_node_fixture.g.mbt \
            loomgen/fixtures/rule_grammar_fixture.g.mbt \
            loomgen/fixtures/separated_list_fixture.g.mbt \
            loomgen/fixtures/line_pattern_fixture.g.mbt \
            fixtures/line_lexer_regression/line_lexer.g.mbt \
            fixtures/line_lexer_regression/lexer_skeleton.g.mbt
          moon check --target native fixtures/line_lexer_regression
          moon test --target native fixtures/line_lexer_regression
      - name: Verify pattern lexer compile-runtime regression fixture
        working-directory: .
        run: |
          bash fixtures/pattern_lexer_regression/regenerate.sh
          git diff --exit-code -- fixtures/pattern_lexer_regression/pattern_lexer.g.mbt
          moon check --target native fixtures/pattern_lexer_regression
          moon test --target native fixtures/pattern_lexer_regression
  all-checks-passed:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs:
      - agent-readiness-selftest
      - bench-detector-selftest
      - markdown-ir-perf-guard
      - dep-check
      - docs-check
      - mbti-check
      - quickstart-check
      - fmt-check
      - fmt-check-submodules
      - test-modules
      - test-modules-submodules
      - check-loomgen
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          if [[ "${{ needs.agent-readiness-selftest.result }}" != "success" ]]; then
            echo "agent-readiness-selftest job failed"
            exit 1
          fi
          if [[ "${{ needs.bench-detector-selftest.result }}" != "success" ]]; then
            echo "bench-detector-selftest job failed"
            exit 1
          fi
          if [[ "${{ needs.markdown-ir-perf-guard.result }}" != "success" && \
                "${{ needs.markdown-ir-perf-guard.result }}" != "skipped" ]]; then
            echo "markdown-ir-perf-guard job failed"
            exit 1
          fi
          if [[ "${{ needs.dep-check.result }}" != "success" ]]; then
            echo "dep-check job failed"
            exit 1
          fi
          if [[ "${{ needs.docs-check.result }}" != "success" ]]; then
            echo "docs-check job failed"
            exit 1
          fi
          if [[ "${{ needs.mbti-check.result }}" != "success" ]]; then
            echo "mbti-check job failed"
            exit 1
          fi
          if [[ "${{ needs.quickstart-check.result }}" != "success" ]]; then
            echo "quickstart-check job failed"
            exit 1
          fi
          if [[ "${{ needs.fmt-check.result }}" != "success" ]]; then
            echo "fmt-check job failed"
            exit 1
          fi
          if [[ "${{ needs.fmt-check-submodules.result }}" != "success" ]]; then
            echo "fmt-check-submodules job failed"
            exit 1
          fi
          if [[ "${{ needs.test-modules.result }}" != "success" ]]; then
            echo "test-modules job failed"
            exit 1
          fi
          if [[ "${{ needs.test-modules-submodules.result }}" != "success" ]]; then
            echo "test-modules-submodules job failed"
            exit 1
          fi
          if [[ "${{ needs.check-loomgen.result }}" != "success" ]]; then
            echo "check-loomgen job failed"
            exit 1
          fi
          echo "All checks passed"
